<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup DEE SINPAD — Propuesta de optimización</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F8F8F8;--surface:#fff;--line:#E6E6E6;--line2:#D1D5DB;--text:#2B2B2B;--muted:#717170;
  --primary:#FF7427;--primary-h:#E5601A;--accent:#FF7427;--orange-bg:#FFF3E1;--blue:#0D64A0;--blue-bg:#E6F0FA;--thead:#F7F6F4;
  --ok:#14632D;--ok-bg:#DDF3E4;--warn:#7A4B00;--warn-bg:#FFEFC7;--off:#475467;--off-bg:#ECEFF3;--bad:#B42318;--bad-bg:#FDE7E4;
  --r:12px;--sh:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:14px/1.5 Roboto,"Segoe UI",system-ui,Arial,sans-serif;color:var(--text);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #1D6FD6;outline-offset:2px;border-radius:6px}
.app{display:grid;grid-template-columns:236px minmax(0,1fr) 0;min-height:100vh}
.app.notes-open{grid-template-columns:236px minmax(0,1fr) 344px}
.side{background:#fff;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto;padding:16px 12px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px}
.brand .mark{width:34px;height:34px;border-radius:50%;border:3px solid var(--accent);display:grid;place-items:center;color:var(--accent);font-weight:700;font-size:13px}
.brand b{font-size:22px;color:var(--blue);letter-spacing:.3px}
.navh{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 10px 4px}
.nav a{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;color:var(--text);text-decoration:none}
.nav a:hover{background:#F0F3F6}
.nav a.on{background:#FFF1E6;color:var(--primary-h);font-weight:500}
.nav a .dot{width:6px;height:6px;border-radius:50%;background:var(--line2)}
.nav a.on .dot{background:var(--accent)}
.side .foot{margin-top:auto;font-size:12px;color:var(--muted);padding:12px 8px 0}
.mainwrap{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:10px 24px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top .sp{flex:1}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:3px 10px;border-radius:999px;background:var(--warn-bg);color:var(--warn)}
.tbtn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px}
.tbtn[aria-pressed=true]{background:var(--blue-bg);border-color:#9CC3E8;color:var(--blue)}
.user{display:flex;flex-direction:column;line-height:1.2;text-align:right;font-size:12px}
.user b{font-size:13px}
.burger{display:none}
main{padding:20px 24px 48px;outline:none}
.page-h{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.page-h h1{margin:0;font-size:22px;font-weight:500}
.crumb{font-size:12px;color:var(--muted);margin-top:2px}
.crumb span+span::before{content:"/";margin:0 6px;color:var(--line2)}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);padding:20px}
.card+.card{margin-top:16px}
h2{font-size:16px;margin:0 0 10px;font-weight:500}
h3{font-size:14px;margin:0 0 6px;font-weight:500}
p{margin:0 0 8px}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:999px;border:1px solid transparent;padding:9px 18px;cursor:pointer;font-weight:500;background:#fff;text-decoration:none}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-h)}
.btn-primary[disabled]{background:#D9C7BD;cursor:not-allowed}
.btn-ghost{border-color:var(--line2);color:var(--text)}
.btn-ghost:hover{background:#F4F6F8}
.btn-sm{padding:5px 12px;font-size:13px}
.btn-link{border:0;background:none;color:var(--blue);padding:4px 6px;border-radius:6px;cursor:pointer;text-decoration:underline}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;padding:2px 10px;border-radius:999px;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok)}.b-warn{background:var(--warn-bg);color:var(--warn)}.b-off{background:var(--off-bg);color:var(--off)}
.b-draft{background:#fff;color:var(--off);border:1px dashed var(--line2)}.b-conf{background:var(--blue-bg);color:var(--blue)}.b-bad{background:var(--bad-bg);color:var(--bad)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.fchip{border:1px solid var(--line2);background:#fff;border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px}
.fchip[aria-pressed=true]{background:#FFF1E6;border-color:#F3B58C;color:var(--primary-h);font-weight:500}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:10px;align-items:end;margin-bottom:14px}
label.l{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.in,select.in,textarea.in{width:100%;border:1px solid var(--line2);border-radius:10px;padding:9px 12px;background:#fff;min-height:40px}
.in[readonly]{background:#F4F6F8;color:var(--muted)}
.in[aria-invalid=true]{border-color:var(--bad);background:#FFF8F7}
.err{color:var(--bad);font-size:12px;margin-top:3px;min-height:0}
.hint{color:var(--muted);font-size:12px;margin-top:3px}
.tblw{overflow:auto;border-radius:10px;border:1px solid var(--line)}
table.tbl{width:100%;border-collapse:collapse;min-width:900px}
.tbl th{background:var(--thead);text-align:left;font-size:12px;letter-spacing:.04em;text-transform:uppercase;padding:10px 12px;white-space:nowrap}
.tbl td{padding:11px 12px;border-top:1px solid var(--line);vertical-align:middle}
.tbl tr:hover td{background:#FAFBFC}
.tbl .sub{color:var(--muted);font-size:12px}
.tbl .r{text-align:right}
.acts{display:flex;gap:6px;align-items:center;justify-content:flex-end;position:relative}
.kebab{border:1px solid var(--line2);background:#fff;border-radius:8px;width:32px;height:32px;cursor:pointer;font-weight:700}
.menu{position:absolute;right:0;top:36px;background:#fff;border:1px solid var(--line);box-shadow:0 8px 24px rgba(16,24,40,.16);border-radius:10px;min-width:220px;z-index:15;padding:6px;text-align:left}
.menu button{display:flex;width:100%;gap:8px;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px;cursor:pointer}
.menu button:hover{background:#F4F6F8}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.menu .danger{color:var(--bad)}
.pager{display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:var(--muted);font-size:13px}
.mini{height:6px;background:var(--off-bg);border-radius:6px;overflow:hidden;margin-top:4px;min-width:80px}
.mini i{display:block;height:100%;background:var(--accent)}
.stepper{display:flex;gap:8px;list-style:none;padding:0;margin:0 0 16px;flex-wrap:wrap}
.stepper li{flex:1;min-width:180px}
.stp{width:100%;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left}
.stp[disabled]{cursor:default;opacity:.65}
.stp .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--off-bg);font-weight:700;font-size:13px}
.stepper .cur .stp{border-color:var(--accent);box-shadow:0 0 0 3px #FFE3D0}
.stepper .cur .n{background:var(--primary);color:#fff}
.stepper .done .n{background:var(--ok-bg);color:var(--ok)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.wizfoot{display:flex;justify-content:space-between;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line);flex-wrap:wrap}
.wizfoot .r{display:flex;gap:10px;flex-wrap:wrap}
.alert{border-radius:10px;padding:10px 14px;display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.a-info{background:var(--blue-bg);color:#0B3F70}.a-warn{background:var(--warn-bg);color:var(--warn)}.a-ok{background:var(--ok-bg);color:var(--ok)}.a-bad{background:var(--bad-bg);color:var(--bad)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tab{border:0;background:none;padding:10px 14px;cursor:pointer;border-bottom:3px solid transparent;color:var(--muted);font-weight:500}
.tab[aria-selected=true]{color:var(--primary-h);border-bottom-color:var(--accent)}
.amb{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.tree{border:1px solid var(--line);border-radius:10px;max-height:520px;overflow:auto;padding:6px}
.tree summary{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;cursor:pointer;list-style:none}
.tree summary::-webkit-details-marker{display:none}
.tree summary::before{content:"▸";color:var(--muted);width:12px;transition:transform .15s}
.tree details[open]>summary::before{transform:rotate(90deg)}
.tree summary:hover{background:#F4F6F8}
.tree .provs{margin-left:22px}
.tree .dists{list-style:none;margin:0 0 4px 28px;padding:0;columns:2;column-gap:12px}
.tree .dists li{break-inside:avoid}
.tree .dists label{display:flex;gap:8px;align-items:center;padding:3px 6px;border-radius:6px;cursor:pointer}
.tree .dists label:hover{background:#F4F6F8}
.tree .nm{flex:1}
.tree .cnt{font-size:12px;color:var(--muted);background:var(--off-bg);padding:1px 8px;border-radius:999px}
.tree .cnt.full{background:var(--ok-bg);color:var(--ok)}
.tree mark{background:#FFE08A;border-radius:3px}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--primary)}
.sticky{position:sticky;top:64px}
.counter{border-radius:12px;padding:14px 16px;margin-bottom:12px}
.counter .big{font-size:30px;font-weight:700;line-height:1}
.counter .big small{font-size:15px;font-weight:400;color:var(--muted)}
.c-ok{background:var(--ok-bg);color:var(--ok)}.c-warn{background:var(--warn-bg);color:var(--warn)}.c-bad{background:var(--bad-bg);color:var(--bad)}.c-off{background:var(--off-bg);color:var(--off)}
.bar{height:8px;border-radius:8px;background:rgba(0,0,0,.1);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:currentColor;opacity:.75}
.selbox{border:1px solid var(--line);border-radius:10px;max-height:340px;overflow:auto;padding:6px}
.selbox details>summary{cursor:pointer;padding:5px 6px;border-radius:6px;display:flex;gap:8px;align-items:center}
.selbox details>summary:hover{background:#F4F6F8}
.selbox .in2{margin-left:18px}
.chipw{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 8px 18px}
.chip{border:1px solid var(--line2);background:#fff;border-radius:999px;padding:2px 10px;font-size:12px;cursor:pointer}
.chip:hover{border-color:var(--bad);color:var(--bad)}
.chip.ro{cursor:default}.chip.ro:hover{border-color:var(--line2);color:inherit}
textarea.paste{width:100%;min-height:220px;font-family:ui-monospace,Consolas,monospace;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:12px 0}
.kpi{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi b{display:block;font-size:22px}
.steps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stepbox{border:1px solid var(--line);border-radius:12px;padding:14px}
.dz{border:2px dashed var(--line2);border-radius:12px;padding:24px;text-align:center;color:var(--muted)}
.empty{text-align:center;padding:36px 12px;color:var(--muted)}
.empty svg{margin-bottom:8px}
.empty h3{color:var(--text);font-size:16px}
.tl{margin:10px 0 4px}
.tl .track{height:10px;background:var(--off-bg);border-radius:10px;overflow:hidden}
.tl .track i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#F59E0B)}
.tl .ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}
dl.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px 16px;margin:0}
dl.kv dt{color:var(--muted)}dl.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.modal{position:fixed;inset:0;background:rgba(16,24,40,.5);display:grid;place-items:center;z-index:50;padding:16px}
.modal .box{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:24px;box-shadow:0 24px 64px rgba(16,24,40,.3)}
.modal .box h2{font-size:18px}
.modal .acts2{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#1A2330;color:#fff;padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
.pin{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--blue);color:#fff;font-size:11px;font-weight:700;border:0;cursor:pointer;margin-left:6px;vertical-align:middle;flex:none}
body.nopins .pin{display:none}
.notes{background:#fff;border-left:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto;width:344px;padding:16px;display:none}
.app.notes-open .notes{display:block}
.notes h2{font-size:15px}
.note{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.note .hd{display:flex;gap:8px;align-items:center;margin-bottom:4px;font-weight:500}
.note .num{background:var(--blue);color:#fff;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;flex:none}
.note .src{font-size:11px;font-weight:500;padding:1px 8px;border-radius:999px;margin-left:auto}
.s-inf{background:var(--blue-bg);color:var(--blue)}.s-sen{background:#FFF1E6;color:var(--primary-h)}.s-val{background:var(--warn-bg);color:var(--warn)}
.note p{margin:0;color:#344054;font-size:13px}
.note.flash{animation:fl 1.4s}
@keyframes fl{0%,60%{box-shadow:0 0 0 3px #9CC3E8}100%{box-shadow:none}}
.matrix td,.matrix th{vertical-align:top}
.rec-ok{color:var(--ok)}.rec-bad{color:var(--bad)}
.hero{background:linear-gradient(135deg,#0F5C9E,#0B4A82);color:#fff;border-radius:var(--r);padding:24px}
.hero h1{margin:0 0 6px;font-size:24px;font-weight:500}
.hero p{margin:0;opacity:.92;max-width:78ch}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.cols2>.card{margin-top:0}
ul.tight{margin:0;padding-left:18px}ul.tight li{margin:3px 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:1180px){.app.notes-open{grid-template-columns:236px minmax(0,1fr) 0}.app.notes-open .notes{position:fixed;right:0;top:0;z-index:40;box-shadow:-8px 0 24px rgba(16,24,40,.2)}}
@media (max-width:900px){.app,.app.notes-open{grid-template-columns:minmax(0,1fr)}.side{position:fixed;left:-260px;width:236px;z-index:45;transition:left .2s}.side.open{left:0}.burger{display:inline-block}.amb,.cols2,.steps3{grid-template-columns:1fr}.filters,.g2,.g3,.g4,.kpis{grid-template-columns:1fr 1fr}main{padding:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

function validate(w){
  const e={},d=w.data;
  if(!/^\d{1,4}$/.test(d.numero||''))e.numero='Ingrese el número del decreto.';
  if(!d.inicio)e.inicio='Indique la fecha de inicio.';
  if(!(parseInt(d.plazo,10)>0))e.plazo='Ingrese el plazo en días.';
  if(!urlOk(d.url||''))e.url='Debe ser un enlace de El Peruano (elperuano.pe) o gob.pe.';
  if(!(parseInt(d.nDS,10)>0))e.nDS='Ingrese el N° de distritos que indica el D.S.';
  return e;

function syncTree(w){
  const tree=$('#tree');if(!tree)return;const cnt={};
  Object.keys(GEO).forEach(d=>{if(w.univ&&w.univ.indexOf(d)<0)return;let sd=0,td=0;
    Object.keys(GEO[d]).forEach(p=>{let sp=0;GEO[d][p].forEach(x=>{if(w.sel.has(key(d,p,x)))sp++;});cnt['p|'+d+'|'+p]=[sp,GEO[d][p].length];sd+=sp;td+=GEO[d][p].length;});cnt['d|'+d]=[sd,td];});
  $$('[data-t]',tree).forEach(i=>{const t=i.dataset.t,d=i.dataset.d,p=i.dataset.p,x=i.dataset.x;
    if(t==='x'){i.checked=w.sel.has(key(d,p,x));i.indeterminate=false;}
    else{const c=t==='d'?cnt['d|'+d]:cnt['p|'+d+'|'+p];i.checked=c[0]===c[1]&&c[1]>0;i.indeterminate=c[0]>0&&c[0]<c[1];}});
  $$('[data-cnt]',tree).forEach(el=>{const c=cnt[el.dataset.cnt];if(!c)return;el.textContent=c[0]+' / '+c[1];el.classList.toggle('full',c[0]===c[1]&&c[1]>0);});
}
function filterTree(w){

      $$('li',pd).forEach(li=>{const nm=li.dataset.x,show=!q||norm(nm).indexOf(q)>=0;li.hidden=!show;if(show)anyP=true;
        const sp=$('.xn',li);sp.innerHTML=q&&show?esc(nm).replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','i'),'<mark>$1</mark>'):esc(nm);});
      pd.hidden=!anyP;if(q&&anyP)pd.open=true;if(anyP)anyD=true;});
    dd.hidden=!anyD;if(q&&anyD)dd.open=true;});
}

/* ---------- Router y render ---------- */
const ROUTES={resumen:'Resumen de la propuesta',lista:'Declaratorias',nueva:'Nueva declaratoria','consulta':'Consulta de declaratoria',prorrogas:'Prórrogas','prorroga-nueva':'Nueva prórroga',rectificar:'Rectificación'};
function navHTML(r){
  const it=(h,l,k,ic,sub)=>`<a href="${h}" class="${sub?'sub ':''}${r===k?'on':''}">${ic?ico(ic):''}${l}</a>`;
  const g1=['lista','nueva'].indexOf(r)>=0,g2=['consulta','prorrogas','prorroga-nueva','rectificar'].indexOf(r)>=0;
  return it('#/resumen','Resumen de la propuesta','resumen','star')+
  `<div class="grp ${g1?'open':''}">${ico('doc')}<span>Declaratoria de estado de emergencia</span><span class="chev">${IC.chev}</span></div>`+
  it('#/lista','Declaratorias','lista','',1)+`<a href="#/nueva" data-reset="D" class="sub ${r==='nueva'?'on':''}">Nueva declaratoria</a>`+
  `<div class="grp ${g2?'open':''}">${ico('folder')}<span>Otras pantallas</span><span class="chev">${IC.chev}</span></div>`+
  it('#/consulta/148','Consulta de declaratoria','consulta','',1)+it('#/prorrogas','Prórrogas','prorrogas','',1)+`<a href="#/prorroga-nueva" data-reset="P" class="sub ${r==='prorroga-nueva'?'on':''}">Nueva prórroga</a>`+it('#/rectificar','Rectificación','rectificar','',1);
}
function notesKey(r,w){if(r==='nueva')return 'nueva-'+w.step;if(r==='prorroga-nueva')return w.step===1?'prorroga-1':(w.step===2?'prorroga-2':'nueva-3');return r;}
function renderNotes(r){
  const w=curWiz(),k=notesKey(r,w||{}),list=NOTES[k]||[];
  const tag={inf:['Informe','s-inf'],sen:['Criterio senior','s-sen'],val:['Por validar','s-val']};
  const done=w&&w.done;
  $('#notes').innerHTML=`<h2>Notas de diseño</h2><p class="muted" style="font-size:12px">${list.length&&!done?'Lo que pide el <b>informe técnico</b> y lo que mejoramos por <b>criterio senior</b> en esta pantalla.':'Sin notas para esta vista.'}</p>`+(done?'':list.map(n=>`<div class="note" data-note="${n[0]}"><div class="hd"><span class="num">${n[0]}</span>${esc(n[2])}<span class="src ${tag[n[1]][1]}">${tag[n[1]][0]}</span></div><p>${esc(n[3])}</p></div>`).join(''));
  const has=list.length>0&&!done;$('#app').classList.toggle('notes-open',S.notesOpen&&has);$('#btnNotes').hidden=!has;$('#btnNotes').setAttribute('aria-pressed',String(S.notesOpen));
}
function render(keepScroll){
  const h=location.hash.replace(/^#\/?/,'')||'resumen';const parts=h.split('/');const r=parts[0];
  S.route=ROUTES[r]?r:'resumen';
  let html='';
  switch(S.route){
   case 'resumen':html=resumenView();break;
   case 'lista':html=listaView();break;
   case 'nueva':html=wizView('dee');break;
   case 'prorroga-nueva':html=wizView('prorroga');break;
   case 'consulta':html=consultaView(parts[1]||'148');break;
   case 'prorrogas':html=prorrogasView();break;
   case 'rectificar':html=rectView();break;
  }
  const v=$('#view');v.innerHTML=html;$('#nav').innerHTML=navHTML(S.route);
  document.title=(ROUTES[S.route])+' · Mockup DEE SINPAD';
  renderNotes(S.route);
  const w=curWiz();
  if(w&&!w.done&&w.step===2&&w.tab==='arbol'){syncTree(w);filterTree(w);}
  if(!keepScroll){window.scrollTo(0,0);}
  $('#side').classList.remove('open');
}
window.addEventListener('hashchange',()=>{S.ctab='resumen';render();v_focus();});
function v_focus(){try{$('#view').focus({preventScroll:true});}catch(e){}}

/* ---------- Eventos ---------- */
function closeMenus(){$$('.menu').forEach(m=>m.hidden=true);}
document.addEventListener('click',e=>{
  const reset=e.target.closest('[data-reset]');if(reset){const r=reset.dataset.reset;if(r==='D')S.wizD=null;if(r==='P')S.wizP=null;}
  const el=e.target.closest('[data-act]');
  if(!el){closeMenus();return;}
  const a=el.dataset.act,w=curWiz();
  if(a!=='menu')closeMenus();
  switch(a){
   case 'go':{if(el.dataset.reset==='D')S.wizD=null;if(el.dataset.reset==='P')S.wizP=null;
     if(el.dataset.step&&el.dataset.to==='#/nueva'){const nw=getWiz('dee');nw.data.numero='151';nw.data.nDS='707';nw.step=+el.dataset.step||2;}
     const t=el.dataset.to;if(location.hash===t)render();else location.hash=t;break;}
   case 'burger':if(window.innerWidth>900)$('#app').classList.toggle('side-off');else $('#side').classList.toggle('open');break;
   case 'notes':S.notesOpen=!S.notesOpen;renderNotes(S.route);break;
   case 'pins':S.pins=!S.pins;document.body.classList.toggle('nopins',!S.pins);el.setAttribute('aria-pressed',String(S.pins));break;
   case 'pin':{S.notesOpen=true;renderNotes(S.route);const n=$('.note[data-note="'+el.dataset.n+'"]');if(n){n.scrollIntoView({block:'center',behavior:'smooth'});n.classList.remove('flash');void n.offsetWidth;n.classList.add('flash');}break;}
   case 'reset':location.hash='#/resumen';location.reload();break;
   case 'toast':toast(el.dataset.msg);break;
   case 'menu':{const m=$('.menu',el.parentNode),wasHidden=m.hidden;closeMenus();m.hidden=!wasHidden;e.stopPropagation();break;}
   case 'chip':S.f.chip=el.dataset.v;render(true);break;
   case 'fclear':S.f={q:'',vig:'',reg:'',pel:'',chip:''};render(true);break;
   case 'ctab':S.ctab=el.dataset.v;render(true);break;
   case 'demoPr':S.demoPr=!S.demoPr;render(true);break;
   case 'expAmb':{const d=dee(el.dataset.id);download('ambito-'+d.id+'.csv',csvOf(d.ambito));break;}
   case 'step':if(w){w.step=+el.dataset.n;render();}break;
   case 'prev':if(w){w.step=Math.max(1,w.step-1);render();}break;
   case 'next':if(w){
      if(w.step===1){w.errs=validate(w);if(Object.keys(w.errs).length){render(true);const first=$('[aria-invalid="true"]');if(first)first.focus();return;}w.step=2;render();}
      else if(w.step===2){w.step=3;render();}}break;
   case 'draft':toast('Avance guardado (ejemplo). Podrá retomarlo desde la lista.');break;
   case 'tab2':if(w){w.tab=el.dataset.v;render(true);}break;
   case 'expand':$$('#tree details').forEach(x=>x.open=true);break;
   case 'collapse':$$('#tree details').forEach(x=>x.open=false);break;
   case 'rm':if(w){w.sel.delete(el.dataset.k);refreshAmbito(w);}break;
   case 'clear':if(w&&w.sel.size&&window.confirm('¿Quitar los '+w.sel.size+' distritos seleccionados?')){w.sel.clear();refreshAmbito(w);}break;
   case 'tpl':download('plantilla-ambito-dee.csv','UBIGEO,DEPARTAMENTO,PROVINCIA,DISTRITO\n010101,Amazonas,Chachapoyas,Chachapoyas');break;
   case 'xl':if(w){w.xl=true;render(true);}break;
   case 'addxl':if(w){allKeys(['Amazonas']).forEach(k=>w.sel.add(k));refreshAmbito(w);toast('84 distritos agregados desde el archivo');}break;
   case 'expSel':if(w)download('ambito-seleccionado.csv',csvOf(Array.from(w.sel)));break;
   case 'confirm':if(w&&!el.disabled)openConfirm(w);break;
   case 'addrect':{const sel=$('#rd');if(sel.value){S.rect.items.push(sel.value);render(true);}break;}
   case 'rmrect':S.rect.items.splice(+el.dataset.i,1);render(true);break;
   case 'sendrect':{const d=dee('148');S.rect.items.forEach(k=>{const i=d.ambito.indexOf(k);if(i>=0)d.ambito.splice(i,1);});d.nDS=d.ambito.length;d.ver=(d.ver||1)+1;
      d.hist.push([fmt(HOY)+' 11:15','Usuario DIREH (ejemplo)','Rectificó el registro',S.rect.tipo+' · quitó '+S.rect.items.length+' distrito(s) · versión '+d.ver+' · motivo: '+S.rect.motivo.trim().slice(0,60)]);
      S.rect={items:[],tipo:'',motivo:''};S.ctab='hist';toast('Rectificación registrada. Versión '+d.ver+'.');location.hash='#/consulta/148';break;}
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeMenus();const m=$('#modal');if(m)m.remove();}});
document.addEventListener('input',e=>{
  const el=e.target,w=curWiz();
  if(el.dataset.f&&w){w.data[el.dataset.f]=el.value;
    if(w.errs[el.dataset.f]){delete w.errs[el.dataset.f];el.removeAttribute('aria-invalid');const er=$('#err-'+el.dataset.f);if(er)er.textContent='';}
    const t=termOf(w);const te=$('#f-termino');if(te)te.value=t?fmt(t):'—';const ti=$('#f-titulo');if(ti)ti.value=titleOf(w);
    const uo=$('#urlok');if(uo)uo.textContent=urlOk(w.data.url)?'✓ Dominio reconocido':'Use un enlace de elperuano.pe o gob.pe';}
  else if(el.id==='tq'&&w){w.q=el.value;filterTree(w);}
  else if(el.id==='cq'){const nq=norm(el.value);$$('#ambro .chip').forEach(c=>{c.hidden=nq&&c.dataset.n.indexOf(nq)<0;});$$('#ambro details.in2').forEach(d=>{const any=$$('.chip',d).some(c=>!c.hidden);d.hidden=!any;if(nq&&any)d.open=true;});}
  else if(el.dataset.fl){S.f[el.dataset.fl]=el.value;$('#rows').innerHTML=rowsHTML();}
  else if(el.dataset.rf){S.rect[el.dataset.rf]=el.value;const b=$('[data-act="sendrect"]');if(b){const R=S.rect;b.disabled=!(R.tipo&&R.motivo.trim().length>=20&&R.items.length>0&&!R.items.some(k=>FONDES[k]));}}
});
document.addEventListener('change',e=>{
  const el=e.target,w=curWiz();
  if(el.dataset.t&&w){const d=el.dataset.d,p=el.dataset.p,x=el.dataset.x;
    if(el.dataset.t==='x'){const k=key(d,p,x);if(el.checked)w.sel.add(k);else w.sel.delete(k);}
    else setGroup(w,d,el.dataset.t==='p'?p:null,el.checked);
    refreshAmbito(w);}
  else if(el.dataset.f&&w){w.data[el.dataset.f]=el.value;const t=termOf(w);const te=$('#f-termino');if(te)te.value=t?fmt(t):'—';const ti=$('#f-titulo');if(ti)ti.value=titleOf(w);}
  else if(el.dataset.fl){S.f[el.dataset.fl]=el.value;$('#rows').innerHTML=rowsHTML();}
  else if(el.dataset.rf){S.rect[el.dataset.rf]=el.value;}
  else if(el.id==='chk'&&w){w.chk=el.checked;const N=parseInt(w.data.nDS,10)||0;const b=$('#confbtn');if(b)b.disabled=!(w.chk&&w.sel.size===N&&N>0);}
});
document.addEventListener('toggle',e=>{const el=e.target,w=curWiz();if(w&&el.dataset&&el.dataset.pk&&el.tagName==='DETAILS'){if(el.open)w.open.add(el.dataset.pk);else w.open.delete(el.dataset.pk);}},true);

function openConfirm(w){
  const isD=w.mode==='dee';
  const m=document.createElement('div');m.className='modal';m.id='modal';m.setAttribute('role','dialog');m.setAttribute('aria-modal','true');m.setAttribute('aria-labelledby','mt');
  m.innerHTML=`<div class="box"><h2 id="mt">¿Confirmar el registro de ${esc(titleOf(w))}?</h2><p>Se bloqueará la edición. Si luego detecta un error, podrá corregirlo con una <b>rectificación</b> (motivo obligatorio, queda en el historial).</p><ul class="tight"><li>${w.sel.size} distritos · ${w.sel.size} de ${esc(w.data.nDS)} según el D.S.</li>${isD?'<li>El ámbito quedará disponible para otros módulos (p. ej. FONDES).</li>':''}</ul><div class="acts2"><button class="btn btn-ghost" data-m="x">Volver a revisar</button><button class="btn btn-primary" data-m="ok" id="mok">Sí, confirmar</button></div></div>`;
  document.body.appendChild(m);$('#mok').focus();
  m.addEventListener('click',ev=>{const b=ev.target.closest('[data-m]');if(ev.target===m||(b&&b.dataset.m==='x')){m.remove();return;}
    if(b&&b.dataset.m==='ok'){m.remove();finishConfirm(w);}});
}
function finishConfirm(w){
  const isD=w.mode==='dee',t=termOf(w);
  if(isD){const keys=Array.from(w.sel);
    S.created={id:'nuevo',num:titleOf(w),evento:w.data.evento,peligro:w.data.peligro,inicio:w.data.inicio,plazo:parseInt(w.data.plazo,10),nDS:parseInt(w.data.nDS,10),registro:'Confirmado',prorrogas:0,ambito:keys,ver:1,url:w.data.url,
      hist:[[fmt(HOY)+' 10:30','Usuario DIREH (ejemplo)','Inició el registro',titleOf(w)+' · plazo '+w.data.plazo+' días'],[fmt(HOY)+' 10:42','Usuario DIREH (ejemplo)','Cotejó contra el anexo del D.S.',keys.length+' de '+w.data.nDS+' según el decreto'],[fmt(HOY)+' 10:44','Usuario DIREH (ejemplo)','Confirmó el registro','Versión 1']]};
    const i=DEES.findIndex(d=>d.id==='nuevo');if(i>=0)DEES.splice(i,1);DEES.unshift(S.created);}
  else{S.prList.push({n:titleOf(w),i:w.data.inicio,p:parseInt(w.data.plazo,10),nd:w.sel.size,s:'Confirmado'});dee('148').prorrogas=S.prList.length;}
  w.done=true;toast('Registro confirmado');render();
}
$('#btnPins').setAttribute('aria-pressed','true');
document.querySelectorAll('[data-ic]').forEach(e=>{e.outerHTML=IC[e.dataset.ic];});
render();
})();
</script>
</body>
</html>
